---
name: CodSpeed Benchmarks

on:
  push:
    branches: ["main"]
  pull_request:
    paths:
      - src/**
      - benchmark/**
      - Cargo.toml
      - Cargo.lock
      - setup.py
      - pyproject.toml
      - uv.lock
      - noxfile.py
      - .github/workflows/codspeed.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  # Never cancel a main run; each one is a baseline point for comparisons.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"
  UV_PYTHON_DOWNLOADS: "false"

jobs:
  codspeed:
    name: Run CodSpeed benchmarks
    # The OS image, Python and Rust are all pinned so that nothing shifts the
    # baseline except our own changes. Bump them together in a dedicated PR.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          prune-cache: true
          cache-suffix: codspeed
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The key doesn't cover the root Cargo.toml, where the profile lives.
          key: profiling

      # Build outside the CodSpeed action, which runs its whole command under
      # valgrind.
      - name: Build benchmark environment
        run: uv run --only-group nox nox -s codspeed --install-only

      - name: Run CodSpeed benchmarks
        uses: CodSpeedHQ/action@c4fd08a3a159bd0cc208da1e0edf32b8c47d75e5 # v5.4.0
        with:
          mode: simulation
          run: uv run --only-group nox nox -s codspeed --no-install -- --codspeed-mode=simulation --numprocesses=auto
