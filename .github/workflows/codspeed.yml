---
name: CodSpeed Benchmarks

on:
  push:
    branches: ["main"]
  pull_request:
    paths:
      - src/**
      - benchmark/**
      - Cargo.toml
      - Cargo.lock
      - setup.py
      - pyproject.toml
      - uv.lock
      - noxfile.py
      - .github/workflows/codspeed.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  # Never cancel a main run; each one is a baseline point for comparisons.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"
  UV_PYTHON_DOWNLOADS: "false"

jobs:
  codspeed:
    name: Run CodSpeed benchmarks
    # The OS image, Python and Rust are all pinned so that nothing shifts the
    # baseline except our own changes. Bump them together in a dedicated PR.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          prune-cache: true
          cache-suffix: codspeed
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The key doesn't cover the root Cargo.toml, where the profile lives.
          key: profiling

      # Build outside the CodSpeed action, which runs its whole command under
      # valgrind.
      - name: Build benchmark environment
        run: uv run --only-group nox nox -s codspeed --install-only

      - name: Run CodSpeed benchmarks
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: simulation
          run: uv run --only-group nox nox -s codspeed --no-install -- --codspeed-mode=simulation --numprocesses=auto
