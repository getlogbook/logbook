---
name: CodSpeed Benchmarks

on:
  push:
    branches: ["main"]
  pull_request:
    paths:
      - src/**
      - benchmark/**
      - Cargo.toml
      - Cargo.lock
      - setup.py
      - pyproject.toml
      - uv.lock
      - noxfile.py
      - .github/workflows/codspeed.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  UV_PYTHON_DOWNLOADS: "false"
  # The pytest-codspeed git source has a submodule with an SSH URL, which
  # fails to clone on runners without an SSH key.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: "url.https://github.com/.insteadOf"
  GIT_CONFIG_VALUE_0: "git@github.com:"

jobs:
  codspeed:
    name: Run CodSpeed benchmarks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Pinned so a new patch release doesn't shift the benchmark baseline.
          python-version: "3.14.7"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          prune-cache: true
          cache-suffix: codspeed
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run CodSpeed benchmarks
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: simulation
          run: uv run --only-group nox nox -s codspeed -- --codspeed-mode=simulation --numprocesses=auto
