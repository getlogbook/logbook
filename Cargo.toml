[workspace]
resolver = "2"
members = [
    "src/rust",
]

[workspace.package]
version = "0.1.0"
authors = ["Frazer McLean <frazer@frazermclean.co.uk>"]
edition = "2021"
publish = false
rust-version = "1.83"
license = "BSD-3-Clause"

# Release build with debug info, so benchmark profiles resolve inlined frames.
[profile.profiling]
inherits = "release"
debug = true

[workspace.dependencies]
arc-swap = "1.7"
pyo3 = "0.29"
